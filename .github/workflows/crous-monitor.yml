name: Surveillance logements CROUS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_ignore_occupation:
        description: "Test temporaire : remplacer occupationModes par tous les modes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: crous-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Diagnostic automatique sans zone (lancement manuel uniquement)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CROUS_SEARCH_URLS: ${{ secrets.CROUS_SEARCH_URLS }}
        run: |
          python - <<'PY'
          import os
          import requests
          from urllib.parse import urlsplit

          urls = [u.strip() for u in os.environ["CROUS_SEARCH_URLS"].splitlines() if u.strip()]
          for search_url in urls:
              parts = urlsplit(search_url).path.strip("/").split("/")
              tool_id = int(parts[1])
              endpoint = f"https://trouverunlogement.lescrous.fr/api/fr/search/{tool_id}"
              body = {
                  "precision": 5,
                  "need_aggregation": False,
                  "page": 1,
                  "pageSize": 100,
                  "sector": None,
                  "idTool": tool_id,
                  "occupationModes": ["alone"],
                  "equipment": [],
                  "price": {"min": 0, "max": None},
                  "location": None,
              }
              response = requests.post(
                  endpoint,
                  json=body,
                  headers={
                      "User-Agent": "CrousMonitorDiagnostic/1.0",
                      "Accept": "application/ld+json, application/json",
                  },
                  timeout=25,
              )
              response.raise_for_status()
              results = response.json().get("results") or {}
              items = results.get("items") or []
              print(f"DIAGNOSTIC SANS BOUNDS | tool={tool_id} | total={results.get('total')} | items={len(items)}")
              for i, item in enumerate(items[:40], 1):
                  residence = item.get("residence") or {}
                  label = residence.get("label") or item.get("label") or "?"
                  address = residence.get("address") or "adresse inconnue"
                  city = residence.get("city") or ""
                  print(f"  {i:02d}. {label} | {address} {city}")
          PY

      - name: Vérifier les logements CROUS
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CROUS_SEARCH_URLS: ${{ secrets.CROUS_SEARCH_URLS }}
          MAX_PAGES: "10"
          REQUEST_DELAY_SECONDS: "1.2"
          TEST_IGNORE_OCCUPATION: ${{ inputs.test_ignore_occupation || false }}
        run: python monitor.py

      - name: Sauvegarder l'historique si nécessaire
        run: |
          if git diff --quiet -- data/seen_listings.json; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi

          git config user.name "crous-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_listings.json
          git commit -m "chore: mise à jour des logements détectés"
          git push
